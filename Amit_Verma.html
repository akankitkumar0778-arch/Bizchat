<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BizChat – Wholesale Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --bg-app:        #dce8f5;
  --bg-sidebar:    #ffffff;
  --bg-chat:       #f0f5fb;
  --bg-header:     #ffffff;
  --bg-input:      #ffffff;
  --bg-bubble-out: linear-gradient(135deg, #5bc8d4 0%, #3ab8c8 100%);
  --bg-bubble-in:  #ffffff;
  --bg-selected:   #eef5ff;
  --bg-hover:      #f5f9ff;

  --accent:        #3ab8c8;
  --accent-dark:   #2a9aaa;
  --accent-light:  #e0f6f9;
  --accent-badge:  #3ab8c8;

  --green:         #4cd97b;
  --green-bg:      rgba(76,217,123,0.1);

  --text-primary:  #1a2035;
  --text-secondary:#6b7a99;
  --text-muted:    #a0aec0;
  --text-bubble-out: #ffffff;

  --border:        #e8edf5;
  --border-strong: #d0dae8;
  --shadow-soft:   0 2px 16px rgba(58,184,200,0.08);
  --shadow-card:   0 4px 24px rgba(30,50,100,0.08);
  --shadow-bubble: 0 2px 12px rgba(58,184,200,0.22);

  --font: 'DM Sans', sans-serif;
  --radius: 18px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; width: 100%; overflow: hidden;
  font-family: var(--font);
  background: var(--bg-app);
  color: var(--text-primary);
}

/* ambient background */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 50% at 0% 0%, rgba(58,184,200,0.12) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 100% 100%, rgba(91,200,212,0.1) 0%, transparent 65%);
}

.shell {
  display: flex; width: 100vw; height: 100vh;
  position: relative; z-index: 1;
  padding: 8px; gap: 8px;
}

/* ══════════════════════════
   SIDEBAR
══════════════════════════ */
.sidebar {
  width: 360px; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--bg-sidebar);
  border-radius: 24px;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.sidebar-header {
  padding: 14px 18px 10px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}

.bizchat-logo {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, #5bc8d4 0%, #3ab8c8 100%);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 16px rgba(58,184,200,0.4);
}

.brand-block {
  flex: 1; display: flex; flex-direction: column; gap: 1px;
}

.brand-sub {
  font-size: 10.5px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.02em;
}

.sidebar-title {
  color: var(--text-primary); font-size: 18px; font-weight: 700; flex: 1;
  letter-spacing: -0.03em;
}

.sidebar-icons { display: flex; gap: 4px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.18s, transform 0.15s;
  border: none; background: transparent;
}
.icon-btn:hover { background: var(--bg-hover); transform: scale(1.05); }
.icon-btn svg { fill: var(--text-muted); transition: fill 0.18s; }
.icon-btn:hover svg { fill: var(--accent); }

/* search */
.search-wrap { padding: 0 14px 8px; flex-shrink: 0; }
.search-inner {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-app);
  border: 1.5px solid transparent;
  border-radius: 14px; padding: 10px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-inner:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
  background: #fff;
}
.search-inner svg { fill: var(--text-muted); flex-shrink: 0; }
.search-inner input {
  flex: 1; background: none; border: none; outline: none;
  font-size: 14.5px; font-family: var(--font); color: var(--text-primary);
}
.search-inner input::placeholder { color: var(--text-muted); }

/* section label */
.section-label {
  padding: 2px 18px 6px;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text-muted);
}

/* contact list */
.contact-list { flex: 1; overflow-y: auto; padding: 0px 8px 8px; }
.contact-list::-webkit-scrollbar { width: 3px; }
.contact-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.contact {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 10px; cursor: pointer;
  border-radius: 16px; margin-bottom: 1px;
  transition: background 0.15s, transform 0.12s; position: relative;
}
.contact:hover { background: var(--bg-hover); transform: translateX(2px); }
.contact.active { background: var(--bg-selected); }
.contact.active::after {
  content: '';
  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 50%; border-radius: 0 3px 3px 0;
  background: var(--accent);
}

.c-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: #fff; flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  position: relative;
}
.c-avatar.online::after {
  content: '';
  position: absolute; bottom: 2px; right: 2px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--green); border: 2px solid #fff;
}

.c-info { flex: 1; min-width: 0; }
.c-name { font-size: 15.5px; font-weight: 600; color: var(--text-primary); }
.c-preview {
  font-size: 13.5px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  font-weight: 400;
}
.c-preview.has-unread { color: var(--accent); font-weight: 500; }

.c-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
.c-time { font-size: 12px; color: var(--text-muted); }
.c-time.has-unread { color: var(--accent); font-weight: 600; }
.badge {
  background: var(--accent);
  color: #fff; font-size: 10px; font-weight: 700;
  border-radius: 8px; padding: 2px 7px; min-width: 20px; text-align: center;
}

/* ══════════════════════════
   CHAT PANEL
══════════════════════════ */
.chat-panel {
  flex: 1; display: flex; flex-direction: column;
  min-width: 0; border-radius: 24px;
  background: var(--bg-chat);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

#emptyState {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px;
}
.empty-icon {
  width: 80px; height: 80px; border-radius: 24px;
  background: linear-gradient(135deg, #3ab8c8, #5bc8d4);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(58,184,200,0.35);
  margin-bottom: 8px;
}
#emptyState h2 { font-size: 22px; font-weight: 600; color: var(--text-primary); }
#emptyState p { font-size: 13.5px; text-align: center; max-width: 260px; line-height: 1.7; color: var(--text-secondary); }
.lock-tag {
  font-size: 11.5px; color: var(--text-muted);
  display: flex; align-items: center; gap: 6px;
  background: #fff; border: 1.5px solid var(--border);
  padding: 6px 16px; border-radius: 20px; margin-top: 4px;
}

#chatContainer { display: none; flex: 1; flex-direction: column; min-width: 0; }
#chatContainer.visible { display: flex; }

/* chat header */
.chat-header {
  padding: 10px 16px;
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  background: var(--bg-header);
  border-bottom: 1.5px solid var(--border);
}

.back-btn {
  width: 36px; height: 36px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.18s;
  border: none; background: transparent;
}
.back-btn:hover { background: var(--bg-hover); }
.back-btn svg { fill: var(--accent); }

.chat-hdr-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; color: #fff; flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  position: relative;
}

.chat-header-info { flex: 1; }
.chat-header-name { color: var(--text-primary); font-size: 15px; font-weight: 600; }
.chat-header-sub { color: var(--text-muted); font-size: 12px; margin-top: 1px; font-weight: 400; }
.chat-header-sub.online { color: var(--green); display: flex; align-items: center; gap: 5px; font-weight: 500; }
.chat-header-sub.online::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); display: inline-block;
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

.header-actions { display: flex; gap: 4px; }

/* date chip */
.date-chip { text-align: center; margin: 8px 0 4px; }
.date-chip span {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  border: 1.5px solid var(--border);
  color: var(--text-secondary); font-size: 11px; font-weight: 600;
  padding: 4px 16px; border-radius: 16px; letter-spacing: 0.04em;
  text-transform: uppercase;
}

.sys-note {
  text-align: center; font-size: 11px; color: var(--text-muted);
  background: rgba(255,255,255,0.7); border: 1.5px solid var(--border);
  padding: 4px 18px; border-radius: 14px;
  align-self: center; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}

/* chat area */
.chat-area {
  flex: 1; overflow-y: auto;
  padding: 6px 20px 10px;
  display: flex; flex-direction: column; gap: 4px;
  scroll-behavior: smooth;
}
.chat-area::-webkit-scrollbar { width: 3px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

/* bubbles */
.bubble-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 2px; }
.bubble-row.sent { justify-content: flex-end; }
.bubble-row.recv { justify-content: flex-start; }
.bubble-row.anim { animation: popIn 0.22s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes popIn {
  from { opacity: 0; transform: scale(0.88) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.bubble {
  padding: 10px 14px 7px;
  max-width: 62%; font-size: 15.5px; line-height: 1.55;
  word-break: break-word; position: relative;
}
.bubble.sent {
  background: var(--bg-bubble-out);
  color: var(--text-bubble-out);
  border-radius: 18px 18px 4px 18px;
  box-shadow: var(--shadow-bubble);
}
.bubble.recv {
  background: var(--bg-bubble-in);
  border: 1.5px solid var(--border);
  color: var(--text-primary);
  border-radius: 18px 18px 18px 4px;
  box-shadow: 0 2px 8px rgba(30,50,100,0.07);
}
.bubble .meta {
  display: flex; justify-content: flex-end;
  align-items: center; gap: 4px; margin-top: 3px;
}
.bubble .time { font-size: 10px; color: rgba(255,255,255,0.55); }
.bubble.recv .time { color: var(--text-muted); }
.tick { font-size: 11px; color: rgba(255,255,255,0.5); }
.tick.seen { color: rgba(255,255,255,0.9); }

/* typing */
.typing-row { display: flex; margin-bottom: 4px; }
.typing-bubble {
  background: var(--bg-bubble-in);
  border: 1.5px solid var(--border);
  border-radius: 18px 18px 18px 4px;
  padding: 12px 18px; display: flex; align-items: center; gap: 5px;
  box-shadow: 0 2px 8px rgba(30,50,100,0.07);
}
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); animation: bounce 1.3s infinite ease-in-out;
}
.dot:nth-child(2) { animation-delay: 0.18s; }
.dot:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce {
  0%,60%,100% { transform: translateY(0); opacity: 0.35; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* input bar */
.input-bar {
  display: flex; align-items: flex-end; gap: 10px;
  padding: 8px 14px 10px;
  background: var(--bg-input);
  border-top: 1.5px solid var(--border);
  flex-shrink: 0;
}
.attach-btn {
  background: var(--bg-app); border: 1.5px solid var(--border);
  cursor: pointer; width: 44px; height: 44px; border-radius: 14px;
  transition: background 0.18s, border-color 0.18s; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.attach-btn:hover { background: var(--accent-light); border-color: var(--accent); }
.attach-btn svg { fill: var(--text-muted); transition: fill 0.18s; }
.attach-btn:hover svg { fill: var(--accent); }

.msg-input {
  flex: 1; border: 1.5px solid var(--border); outline: none;
  background: var(--bg-app);
  border-radius: 16px; padding: 11px 16px;
  font-size: 14px; font-family: var(--font);
  color: var(--text-primary); resize: none; max-height: 140px; line-height: 1.5;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.msg-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
  background: #fff;
}
.msg-input::placeholder { color: var(--text-muted); }

.send-btn {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(135deg, #3ab8c8, #5bc8d4);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(58,184,200,0.45);
  transition: transform 0.15s, box-shadow 0.15s;
}
.send-btn:hover {
  transform: scale(1.07);
  box-shadow: 0 6px 20px rgba(58,184,200,0.5);
}
.send-btn:active { transform: scale(0.93); }
.send-btn svg { fill: #fff; }

* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ── avatar colors ── */
.av-teal   { background: linear-gradient(135deg,#3ab8c8,#5bc8d4); }
.av-purple { background: linear-gradient(135deg,#7c6ff5,#a89cf7); }
.av-pink   { background: linear-gradient(135deg,#f06292,#f48fb1); }
.av-amber  { background: linear-gradient(135deg,#ffa726,#ffca28); }
.av-green  { background: linear-gradient(135deg,#26a69a,#4db6ac); }

/* entrance animation for sidebar contacts */
.contact { animation: slideIn 0.3s ease both; }
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
</style>
</head>
<body>
<div class="shell">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <!-- BizChat Logo -->
      <div class="bizchat-logo">
        <span style="font-family:'DM Sans',sans-serif; font-size:20px; font-weight:800; color:#fff; letter-spacing:-1px;">B</span>
      </div>
      <div class="brand-block">
        <span class="sidebar-title">BizChat</span>

      </div>
      <div class="sidebar-icons">
        <button class="icon-btn" title="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
        <button class="icon-btn" title="More options">
          <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
      </div>
    </div>

    <div class="search-wrap">
      <div class="search-inner">
        <svg width="15" height="15" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" placeholder="Search messages…" />
      </div>
    </div>

    <div class="section-label">Recent</div>
    <div class="contact-list" id="contactList"></div>
  </div>

  <!-- CHAT PANEL -->
  <div class="chat-panel">

    <div id="emptyState">
      <div class="empty-icon">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="rgba(255,255,255,0.9)"/>
        </svg>
      </div>
      <h2>BizChat</h2>
      <p>Pick a supplier from the list to start placing or tracking your orders.</p>
      <div class="lock-tag">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        End-to-end encrypted
      </div>
    </div>

    <div id="chatContainer">
      <div class="chat-header">
        <button class="back-btn" onclick="closeChat()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="chat-hdr-avatar" id="hdrAvatar"></div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="hdrName"></div>
          <div class="chat-header-sub" id="hdrSub"></div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" title="Voice call">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="var(--accent)"/></svg>
          </button>
          <button class="icon-btn" title="More">
            <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
          </button>
        </div>
      </div>

      <div class="chat-area" id="chatArea"></div>

      <div class="input-bar">
        <button class="attach-btn" title="Attach">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
        </button>
        <textarea class="msg-input" id="msgInput" rows="1"
          placeholder="Type your order… e.g. 50kg chawal, 20L oil"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>

  </div>
</div>

<script>
const avatarClasses = ['av-teal','av-purple','av-pink','av-amber','av-green'];

const wholesalers = [
  {
    id:'SW', name:'Sharma Wholesale', av:'av-teal', status:'online',
    messages:[
      {from:'me',   text:'Bhai, 10 Mar se regular order de raha hoon. Har baar time pe aata hai. 🔥', time:'9:30 AM',   seen:true},
      {from:'them', text:'Amit ji aap hamare best customer hain! 🔔',                                 time:'9:32 AM',   seen:true},
      {from:'me',   text:'Aaj do orders chahiye — mustard oil + chana dal, aur sunflower oil + toor dal.', time:'10:00 AM', seen:true},
      {from:'them', text:'Sure! Dono orders note kar liye. 🚚',                                       time:'10:02 AM',  seen:true},
      {from:'me',   text:'Koi update hai order ka?',                                                  time:'Yesterday', seen:true},
    ],
    replies:[
      'Ji bilkul! Order note kar liya hai 🙏',
      'Haan ji, delivery kal subah tak ho jayegi.',
      'Theek hai, add kar diya. Koi aur cheez chahiye?',

let activeId = null;

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function now(){
  const d=new Date(); let h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';
  if(h>12)h-=12; if(h===0)h=12;
  return h+':'+(m<10?'0'+m:m)+' '+ap;
}
function randReply(id){
  const w=wholesalers.find(x=>x.id===id);
  const a=w?w.replies:['Theek hai!'];
  return a[Math.floor(Math.random()*a.length)];
}
function getW(id){return wholesalers.find(w=>w.id===id);}

function renderSidebar(filter){
  filter=(filter||'').toLowerCase();
  const list=document.getElementById('contactList');
  list.innerHTML='';
  wholesalers.filter(w=>w.name.toLowerCase().includes(filter)).forEach((w,i)=>{
    const last=w.messages[w.messages.length-1];
    const unread=w.messages.filter(m=>m.from==='them'&&!m.seen).length;
    const div=document.createElement('div');
    div.className='contact'+(activeId===w.id?' active':'');
    div.style.animationDelay = (i * 0.05) + 's';
    const isOnline = w.status === 'online';
    div.innerHTML=`
      <div class="c-avatar ${w.av}${isOnline?' online':''}">${w.id}</div>
      <div class="c-info">
        <div class="c-name">${w.name}</div>
        <div class="c-preview${unread?' has-unread':''}">${last?esc(last.text):''}</div>
      </div>
      <div class="c-meta">
        <span class="c-time${unread?' has-unread':''}">${last?last.time:''}</span>
        ${unread?`<span class="badge">${unread}</span>`:''}
      </div>`;
    div.addEventListener('click',()=>openChat(w.id));
    list.appendChild(div);
  });
}

function openChat(id){
  activeId=id;
  const w=getW(id);
  w.messages.forEach(m=>{if(m.from==='them')m.seen=true;});
  renderSidebar(document.getElementById('searchInput').value);
  document.getElementById('emptyState').style.display='none';
  document.getElementById('chatContainer').classList.add('visible');
  const av=document.getElementById('hdrAvatar');
  av.textContent=w.id;
  av.className='chat-hdr-avatar '+w.av;
  document.getElementById('hdrName').textContent=w.name;
  setSubStatus(w);
  renderMessages(id);
  document.getElementById('msgInput').focus();
}

function closeChat(){
  activeId=null;
  document.getElementById('chatContainer').classList.remove('visible');
  document.getElementById('emptyState').style.display='flex';
  renderSidebar();
}

function setSubStatus(w){
  const sub=document.getElementById('hdrSub');
  if(!sub)return;
  if(w.status==='online'){sub.textContent='Online';sub.className='chat-header-sub online';}
  else{sub.textContent=w.status;sub.className='chat-header-sub';}
}

function renderMessages(id){
  const w=getW(id);
  const area=document.getElementById('chatArea');
  area.innerHTML=`<div class="date-chip"><span>Today</span></div>
    <div class="sys-note">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      End-to-end encrypted
    </div>`;
  w.messages.forEach(m=>addBubble(area,m.from,m.text,m.time,true,m.seen));
  area.scrollTop=area.scrollHeight;
}

function addBubble(area,from,text,time,instant,seen){
  const row=document.createElement('div');
  row.className='bubble-row '+(from==='me'?'sent':'recv')+(instant?'':' anim');
  const tick=from==='me'?`<span class="tick${seen?' seen':''}">✓✓</span>`:'';
  row.innerHTML=`<div class="bubble ${from==='me'?'sent':'recv'}">${esc(text)}<div class="meta"><span class="time">${time}</span>${tick}</div></div>`;
  area.appendChild(row);
  return row;
}

function showTyping(area){
  const row=document.createElement('div');
  row.className='typing-row'; row.id='typingInd';
  row.innerHTML=`<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  area.appendChild(row);
  area.scrollTo({top:area.scrollHeight,behavior:'smooth'});
  return row;
}

function sendMessage(){
  if(!activeId)return;
  const input=document.getElementById('msgInput');
  const area=document.getElementById('chatArea');
  const w=getW(activeId);
  const txt=input.value.trim();
  if(!txt)return;
  const lines=txt.split('\n').filter(l=>l.trim());
  lines.forEach((line,i)=>{
    setTimeout(()=>{
      const t=now();
      const mo={from:'me',text:line,time:t,seen:false};
      w.messages.push(mo);
      const row=addBubble(area,'me',line,t,false,false);
      area.scrollTo({top:area.scrollHeight,behavior:'smooth'});
      setTimeout(()=>{const tk=row.querySelector('.tick');if(tk){tk.classList.add('seen');mo.seen=true;}},700);
      if(i===lines.length-1){
        setTimeout(()=>{
          const sub=document.getElementById('hdrSub');
          if(sub){sub.textContent='typing…';sub.className='chat-header-sub online';}
          const tr=showTyping(area);
          const delay=1400+Math.random()*900;
          setTimeout(()=>{
            if(tr.parentNode)tr.remove();
            const reply=randReply(activeId);
            const rt=now();
            w.messages.push({from:'them',text:reply,time:rt,seen:true});
            addBubble(area,'them',reply,rt,false,true);
            area.scrollTo({top:area.scrollHeight,behavior:'smooth'});
            setSubStatus(w);
            renderSidebar(document.getElementById('searchInput').value);
          },delay);
        },1000);
      }
    },i*90);
  });
  input.value=''; input.style.height='auto';
  renderSidebar(document.getElementById('searchInput').value);
}

document.getElementById('sendBtn').addEventListener('click',sendMessage);
document.getElementById('msgInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});
document.getElementById('msgInput').addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,140)+'px';
});
document.getElementById('searchInput').addEventListener('input',e=>renderSidebar(e.target.value));

renderSidebar();
openChat('SW');

// ═══════════════════════════════════════════
//   REAL-TIME SYNC — Contact ID: 3
// ═══════════════════════════════════════════
(function() {
  var CONTACT_ID = 3;
  var WS_ID = 'SW';
  var chatKey = 'bizchat_chat_' + CONTACT_ID;
  var bc = new BroadcastChannel('bizchat_sync');

  function getHistory() {
    try { return JSON.parse(localStorage.getItem(chatKey) || '[]'); } catch(e) { return []; }
  }
  function saveToHistory(msgObj) {
    var h = getHistory(); h.push(msgObj);
    localStorage.setItem(chatKey, JSON.stringify(h));
  }
  function fmtTime() {
    var d=new Date(),h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';
    if(h>12)h-=12; if(h===0)h=12;
    return h+':'+(m<10?'0'+m:m)+' '+ap;
  }

  // ── Render a bubble into chatArea ──
  function renderBubble(text, isMine, time) {
    var area = document.getElementById('chatArea');
    if(!area) return;
    var row = document.createElement('div');
    row.className = 'bubble-row ' + (isMine ? 'sent' : 'recv');
    if(isMine) {
      row.innerHTML = '<div class="bubble sent">'+text+'<div class="meta"><span class="time">'+time+'</span><span class="tick seen">✓✓</span></div></div>';
    } else {
      row.innerHTML = '<div class="bubble recv">'+text+'<div class="meta"><span class="time">'+time+'</span></div></div>';
    }
    area.appendChild(row);
    area.scrollTo({top: area.scrollHeight, behavior:'smooth'});
  }

  // ── Load stored history into current chat view ──
  function loadHistory() {
    if(activeId !== WS_ID) return;
    var history = getHistory();
    if(!history.length) return;
    var area = document.getElementById('chatArea');
    if(!area) return;
    // Add a divider
    var chip = document.createElement('div');
    chip.className = 'date-chip';
    chip.innerHTML = '<span>— Live Messages —</span>';
    area.appendChild(chip);
    history.forEach(function(msg) {
      renderBubble(msg.text, msg.from === 'customer', msg.time);
    });
  }

  // ── Toast notification ──
  function showToast(text) {
    var toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#1a2035;color:#fff;padding:12px 16px;border-radius:12px;font-size:12px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.25);max-width:260px;cursor:pointer;border-left:3px solid #3ab8c8;';
    toast.innerHTML = '<div style="font-size:10px;color:#94a3b8;margin-bottom:2px;">📦 New message from Sharma Wholesale</div><div style="font-size:11px;color:#cbd5e1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+text+'</div>';
    toast.onclick = function() { openChat(WS_ID); toast.remove(); };
    document.body.appendChild(toast);
    setTimeout(function(){ if(toast.parentNode) toast.remove(); }, 4000);
  }

  // ── Listen for wholesaler messages ──
  bc.onmessage = function(e) {
    var data = e.data;
    if(!data || data.type !== 'NEW_MSG') return;
    if(data.contactId !== CONTACT_ID) return;
    if(data.msg.from !== 'wholesaler') return;

    var w = wholesalers.find(function(x){ return x.id === WS_ID; });
    if(w) w.messages.push({from:'them', text:data.msg.text, time:data.msg.time, seen:false});

    if(activeId === WS_ID) {
      var typing = document.getElementById('typingInd');
      if(typing) typing.remove();
      renderBubble(data.msg.text, false, data.msg.time);
      var sub = document.getElementById('hdrSub');
      if(sub) { sub.textContent='Online'; sub.className='chat-header-sub online'; }
    } else {
      showToast(data.msg.text);
    }
    renderSidebar(document.getElementById('searchInput').value);
  };

  // ── Patch sendMessage ──
  var _origSend = window.sendMessage;
  window.sendMessage = function() {
    if(activeId !== WS_ID) {
      return _origSend.apply(this, arguments);
    }
    var input = document.getElementById('msgInput');
    var txt = input ? input.value.trim() : '';
    if(!txt) return;
    var t = fmtTime();

    renderBubble(txt, true, t);

    var msgObj = {from:'customer', text:txt, time:t, id:Date.now()};
    saveToHistory(msgObj);
    bc.postMessage({type:'NEW_MSG', contactId:CONTACT_ID, msg:msgObj});

    var w = wholesalers.find(function(x){ return x.id === WS_ID; });
    if(w) w.messages.push({from:'me', text:txt, time:t, seen:true});

    input.value = ''; input.style.height = 'auto';
    renderSidebar(document.getElementById('searchInput').value);

    // Fake "typing…" indicator from wholesaler
    setTimeout(function() {
      if(activeId !== WS_ID) return;
      var sub = document.getElementById('hdrSub');
      if(sub) { sub.textContent='typing…'; sub.className='chat-header-sub online'; }
      var area = document.getElementById('chatArea');
      if(area) {
        var tr = showTyping(area);
        setTimeout(function() {
          if(tr && tr.parentNode) tr.remove();
          if(sub) { sub.textContent='Online'; sub.className='chat-header-sub online'; }
        }, 2500);
      }
    }, 600);
  };

  // ── Patch openChat to load history ──
  var _origOpen = window.openChat;
  window.openChat = function(id) {
    _origOpen.apply(this, arguments);
    if(id === WS_ID) {
      // Small delay to let renderMessages finish first
      setTimeout(loadHistory, 50);
    }
  };

  // ── Re-attach event listeners to use patched sendMessage ──
  var sendBtn = document.getElementById('sendBtn');
  if(sendBtn) {
    var newBtn = sendBtn.cloneNode(true);
    sendBtn.parentNode.replaceChild(newBtn, sendBtn);
    newBtn.addEventListener('click', function(){ window.sendMessage(); });
  }
  var msgInput = document.getElementById('msgInput');
  if(msgInput) {
    msgInput.addEventListener('keydown', function(e) {
      if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); window.sendMessage(); }
    });
  }

  // ── Load history if already on wholesaler chat ──
  if(activeId === WS_ID) {
    setTimeout(loadHistory, 100);
  }
})();

</script>
